services:
  - type: web
    name: pipefy-validator-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_USERNAME
        value: demo
      - key: APP_PASSWORD
        sync: false  # Render pede o valor no primeiro deploy, não vai pro git
      - key: VERIFY_SSL
        value: "false"
      # === Default env opcional (pré-popula onboarding modal pra UX do demo) ===
      # Use PAT de uma org Pipefy DEDICADA ao demo, com user view-only.
      # Não usar PAT da org real (ex: FourD) pra evitar abuso público.
      - key: DEFAULT_PIPEFY_TOKEN
        sync: false  # Render pede no setup
      - key: DEFAULT_PIPEFY_BASE_URL
        value: https://api.pipefy.com/graphql
      - key: DEFAULT_PIPEFY_ORG_ID
        sync: false
      - key: DEFAULT_PIPEFY_NAME
        value: Demo Sandbox
      - key: DEFAULT_PIPEFY_VERIFY_SSL
        value: "true"
